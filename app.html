<body>
  <main class="page-shell">
    <section class="card instructions-card">
      <img src="icons/icon-192.png" class="app-icon" alt="Ícone RH e Você">
      <h1>Instalar no celular</h1>
      <div class="instruction">
        <h2>iPhone</h2>
        <p>Abra esta página no Safari, toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.</p>
      </div>
      <div class="instruction">
        <h2>Android</h2>
        <p>Abra no Chrome, toque no menu do navegador e selecione <strong>Instalar aplicativo</strong> ou <strong>Adicionar à tela inicial</strong>.</p>
      </div>
      <a class="primary link-button" href="login.html">Voltar</a>
    </section>
