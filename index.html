<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a2f87">
  <meta name="description" content="Portal do Colaborador RH | e Você">
  <title>RH | e Você</title>
  <link rel="manifest" href="manifest.json?v=final2026">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=final2026">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=final2026">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=final2026">
  <link rel="shortcut icon" href="favicon.ico?v=final2026">
  <link rel="stylesheet" href="style.css?v=final2026">
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="titulo">
      <img class="brand" src="logo-rh-e-voce.png?v=final2026" alt="RH | e Você">

      <h1 id="titulo">Portal do Colaborador</h1>
      <p class="subtitle">Serviços do RH na palma da sua mão.</p>

      <div class="actions">
        <a id="openPortal" class="btn btn-primary" href="#" rel="noopener noreferrer">
          <span aria-hidden="true">↪</span> Entrar no Portal RH
        </a>
        <button id="installBtn" class="btn btn-install" type="button">
          <span aria-hidden="true">⇩</span> Instalar aplicativo
        </button>
      </div>

      <div id="installMessage" class="install-message" hidden></div>

      <div class="divider"><span>Como instalar</span></div>

      <div class="instructions">
        <div class="instruction">
          <div class="platform-icon apple">●</div>
          <div><strong>iPhone:</strong><br>Safari → Compartilhar → Adicionar à Tela de Início.</div>
        </div>
        <div class="instruction">
          <div class="platform-icon android">●</div>
          <div><strong>Android:</strong><br>Chrome → Instalar aplicativo.</div>
        </div>
      </div>

      <p class="version">Versão Final 2026</p>
    </section>
  </main>

  <script src="config.js?v=final2026"></script>
  <script src="app.js?v=final2026"></script>
</body>
</html>
