<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5fa5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RH | e Você">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="RH | e Você">
  <meta name="description" content="Portal RH | e Você da Ferramentaria Soares">
  <link rel="manifest" href="manifest.json?v=8">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=8">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=8">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=8">
  <link rel="stylesheet" href="style.css?v=8">
  <title>RH | e Você</title>
</head>
<body>
  <main class="shell">
    <section class="card">
      <img class="app-icon" src="icons/icon-192.png?v=8" alt="Ícone de engrenagem do RH | e Você">
      <div class="brand">RH <span>| e Você</span></div>
      <h1>Portal do Colaborador</h1>
      <p>Acesse os serviços do RH de forma rápida e prática.</p>
      <button id="openPortal" type="button">Entrar no Portal RH</button>
      <button id="installBtn" class="secondary" type="button" hidden>Instalar aplicativo</button>
      <div id="iosHelp" class="help" hidden>
        No iPhone, toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <small>Versão 8.0</small>
    </section>
  </main>
  <script src="config.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
