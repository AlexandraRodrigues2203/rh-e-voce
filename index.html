<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17388F">
  <meta name="application-name" content="RH | e Você">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RH | e Você">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="icon" type="image/png" href="app-icon.png">
  <title>RH | e Você | Ferramentaria Soares</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f4f7fa;color:#263747}
    body{display:flex;flex-direction:column}
    .topo{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #d9e3ec;box-shadow:0 2px 10px rgba(0,0,0,.06);z-index:10}
    .topo img{width:46px;height:46px;object-fit:contain;border-radius:10px}
    .titulo{min-width:0;flex:1}
    .titulo strong{display:block;color:#17388F;font-size:16px}
    .titulo span{display:block;font-size:12px;color:#6b7280}
    .btn{border:0;border-radius:10px;padding:10px 14px;background:#17388F;color:#fff;font-weight:700;cursor:pointer}
    .btn.sec{background:#eef3ff;color:#17388F}
    #app{flex:1;width:100%;border:0;background:#fff}
    .instalacao{display:none;padding:14px;background:#eef3ff;border-bottom:1px solid #cfdaef}
    .instalacao.visivel{display:block}
    .instalacao p{margin:0 0 10px;line-height:1.4}
    .acoes{display:flex;gap:8px;flex-wrap:wrap}
    @media(max-width:640px){.topo{padding:8px}.topo img{width:40px;height:40px}.titulo span{display:none}.btn{padding:9px 11px;font-size:13px}}
  </style>
</head>
<body>
  <div id="instalacao" class="instalacao">
    <p id="textoInstalacao"><strong>Instale o RH | e Você</strong> para abrir o portal pela tela inicial do celular.</p>
    <div class="acoes">
      <button id="btnInstalar" class="btn" type="button">Instalar aplicativo</button>
      <button id="btnFechar" class="btn sec" type="button">Agora não</button>
    </div>
  </div>

  <header class="topo">
    <img src="app-icon.png" alt="Ferramentaria Soares">
    <div class="titulo">
      <strong>RH | e Você</strong>
      <span>Ferramentaria Soares</span>
    </div>
    <button id="btnTopoInstalar" class="btn" type="button">Instalar</button>
  </header>

  <iframe
    id="app"
    title="Portal RH | e Você"
    src="https://script.google.com/macros/s/AKfycbwZoTwRG8pjf9LrxWwxlJbDtCqU0vZfMiqSXl6GxfYq2Vr7wFw1KUbQ_dEWUR4ALeVG/exec"
    allow="camera; microphone; clipboard-read; clipboard-write"
  ></iframe>

  <script>
    let deferredPrompt = null;
    const caixa = document.getElementById('instalacao');
    const btnInstalar = document.getElementById('btnInstalar');
    const btnTopoInstalar = document.getElementById('btnTopoInstalar');
    const btnFechar = document.getElementById('btnFechar');
    const texto = document.getElementById('textoInstalacao');

    function emModoApp(){
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function ehIOS(){
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    function mostrarInstalacao(){
      if(emModoApp()) return;
      caixa.classList.add('visivel');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      mostrarInstalacao();
    });

    async function instalar(){
      if(deferredPrompt){
        deferredPrompt.prompt();
        const escolha = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if(escolha.outcome === 'accepted') caixa.classList.remove('visivel');
        return;
      }

      mostrarInstalacao();
      if(ehIOS()){
        texto.innerHTML = '<strong>No iPhone:</strong> abra esta página no Safari, toque em <strong>Compartilhar</strong> e depois em <strong>Adicionar à Tela de Início</strong>.';
      }else{
        texto.innerHTML = '<strong>No Android:</strong> abra esta página no Chrome, toque no menu <strong>⋮</strong> e escolha <strong>Instalar aplicativo</strong> ou <strong>Adicionar à tela inicial</strong>.';
      }
    }

    btnInstalar.addEventListener('click', instalar);
    btnTopoInstalar.addEventListener('click', instalar);
    btnFechar.addEventListener('click', () => caixa.classList.remove('visivel'));

    window.addEventListener('appinstalled', () => caixa.classList.remove('visivel'));

    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    if(emModoApp()) btnTopoInstalar.style.display = 'none';
  </script>
</body>
</html>
